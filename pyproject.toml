[project]
name = "miniviki-mcasdk"
version = "0.1.0"
requires-python = ">=3.14"
description = "miniviki client sdk"
dependencies = [
    "miniviki-mca @ git+https://github.com/ityeri/mca.git@main",
    "httpx>=0.28"
]

[tool.uv.sources]
miniviki-mca = { path = "../mca", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniviki"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["miniviki"]
